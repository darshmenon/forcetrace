[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forcetrace"
version = "0.2.0"
description = "Contact-force metrics and plots for robot manipulation runs (peg-in-hole and similar)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
forcetrace = "forcetrace.cli:main"

[tool.setuptools]
packages = ["forcetrace"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forcetrace"
version = "0.3.0"
description = "Contact-force metrics and plots for robot manipulation runs (peg-in-hole and similar)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "darshmenon" }]
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/darshmenon/forcetrace"
Changelog = "https://github.com/darshmenon/forcetrace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
forcetrace = "forcetrace.cli:main"

[tool.setuptools]
packages = ["forcetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
